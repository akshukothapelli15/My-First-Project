databases:
  - name: focusflow-db
    databaseName: focusflow
    user: focusflow
    plan: free
    region: singapore

services:
  - type: web
    name: focusflow-web
    runtime: node
    plan: free
    region: singapore
    rootDir: focusflow
    buildCommand: npm ci && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: focusflow-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: focusflow-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
